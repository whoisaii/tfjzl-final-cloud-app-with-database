{% extends 'onlinecourse/base.html' %}{% block content %}<h1 class="mb-4">Explore courses</h1>{% for course in courses %}<article class="card mb-3"><div class="card-body"><h2>{{ course.name }}</h2><p>{{ course.description }}</p><a class="btn btn-primary" href="{% url 'onlinecourse:course_details' course.id %}">View course</a></div></article>{% empty %}<p>Add a course through the admin site.</p>{% endfor %}{% endblock %}
